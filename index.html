            playChime() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (this.ctx.state === &#39;suspended&#39;) {
                        this.ctx.resume();
                    }
                    const now = this.ctx.currentTime;
                    [528, 660, 792].forEach((freq, idx) =&gt; {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = &#39;sine&#39;;
                        osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                        gain.gain.setValueAtTime(0.08, now + idx * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2 + idx * 0.2);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.05);
                        osc.stop(now + 1.5);
                    });

        (function initStarfield() {
            const canvas = document.getElementById(&#39;stars-canvas&#39;);

            const ctx = canvas.getContext(&#39;2d&#39;);
            let width, height, stars = [];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                createStars();
            }

            function createStars() {
                stars = [];
                const count = Math.floor((width * height) / 4500);
                for (let i = 0; i &lt; count; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.3 + 0.3,
                        alpha: Math.random() * 0.7 + 0.2,
                        speed: Math.random() * 0.02 + 0.006,
                        color: Math.random() &gt; 0.4 ? &#39;#d4af37&#39; : &#39;#c084fc&#39;
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                stars.forEach(s =&gt; {
                    s.alpha += s.speed;
                    if (s.alpha &gt; 0.95 || s.alpha &lt; 0.2) {
                        s.speed = -s.speed;
                    }
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }

            window.addEventListener(&#39;resize&#39;, resize);
            resize();
            animate();
        })();

            for (let i = 0; i &lt; 4; i++) {

                const isOpen = i &lt; (chosenFall.name.includes(&#39;4&#39;) ? 4 : chosenFall.name.includes(&#39;3&#39;) ? 3 : chosenFall.name.includes(&#39;2&#39;) ? 2 : 1);
                
                const tx = (Math.random() * 160 - 80);
                const ty = (Math.random() * 160 - 80);
                const fx = (Math.random() * 120 - 60);
                const fy = (Math.random() * 120 - 60);
                const rot = Math.floor(Math.random() * 360);

                shell.className = `absolute w-12 h-16 rounded-full border border-gold/70 flex items-center justify-center shadow-lg shell-tossed ${isOpen ? &#39;bg-gradient-to-tr from-amber-100 to-yellow-200 text-mystic-950&#39; : &#39;bg-gradient-to-tr from-mystic-900 to-mystic-800 text-gold&#39;}`;
                shell.style.left = `calc(50% - 24px + ${fx}px)`;
                shell.style.top = `calc(50% - 32px + ${fy}px)`;
                shell.style.setProperty(&#39;--tw-tx&#39;, `${tx}px`);
                shell.style.setProperty(&#39;--tw-ty&#39;, `${ty}px`);
                shell.style.setProperty(&#39;--tw-fx&#39;, `${fx}px`);
                shell.style.setProperty(&#39;--tw-fy&#39;, `${fy}px`);
                shell.style.setProperty(&#39;--tw-rot&#39;, `${rot}deg`);

                shell.innerHTML = `&lt;span class=&quot;text-[10px] font-bold font-cinzel&quot;&gt;${isOpen ? &#39;✦ ABERTO&#39; : &#39;●&#39;}&lt;/span&gt;`;
                tray.appendChild(shell);
            }

            // Update result card
            document.getElementById(&#39;buzios-caida-name&#39;).textContent = `Queda: ${chosenFall.name}`;
            document.getElementById(&#39;buzios-odu-title&#39;).textContent = chosenFall.title;
            document.getElementById(&#39;buzios-guidance-text&#39;).textContent = chosenFall.text;
            document.getElementById(&#39;buzios-verdict-tag&#39;).textContent = `Veredito: ${chosenFall.verdict}`;
            document.getElementById(&#39;buzios-protection-tag&#39;).textContent = `Regência: ${chosenFall.protect}`;
            document.getElementById(&#39;buzios-herb-tag&#39;).textContent = `Conselho: ${chosenFall.herb}`;

            showToast(&quot;Búzios Lançados&quot;, chosenFall.name);
        }

        /* -------------------------------------------------------------
           5. TAB SWITCHING (TAROT / BÚZIOS)
        ------------------------------------------------------------- */
        function switchOracleTab(tab) {
            const tabTarot = document.getElementById(&#39;tab-tarot&#39;);
            const tabBuzios = document.getElementById(&#39;tab-buzios&#39;);
            const contTarot = document.getElementById(&#39;container-tarot-oracle&#39;);
            const contBuzios = document.getElementById(&#39;container-buzios-oracle&#39;);

            if (tab === &#39;tarot&#39;) {
                tabTarot.className = &quot;px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider transition-all duration-300 bg-gold text-mystic-950 shadow-gold-glow&quot;;
                tabBuzios.className = &quot;px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider text-gray-400 hover:text-gold transition-all duration-300&quot;;
                contTarot.classList.remove(&#39;hidden&#39;);
                contBuzios.classList.add(&#39;hidden&#39;);
            } else {
                tabBuzios.className = &quot;px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider transition-all duration-300 bg-gold text-mystic-950 shadow-gold-glow&quot;;
                tabTarot.className = &quot;px-6 py-2.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider text-gray-400 hover:text-gold transition-all duration-300&quot;;
                contBuzios.classList.remove(&#39;hidden&#39;);
                contTarot.classList.add(&#39;hidden&#39;);
            }
        }

        /* -------------------------------------------------------------
           6. SMART BOOKING &amp; WHATSAPP REDIRECTOR ((31) 98895-6933)
        ------------------------------------------------------------- */
        function preselectService(serviceName) {
            const selectEl = document.getElementById(&#39;oracle-choice&#39;);
            if (selectEl) {
                for (let i = 0; i &lt; selectEl.options.length; i++) {
                    if (selectEl.options[i].value.includes(serviceName) || selectEl.options[i].text.includes(serviceName)) {
                        selectEl.selectedIndex = i;
                        break;
                    }
                }
            }
            const targetSection = document.getElementById(&#39;agendamento&#39;);
            if (targetSection) {
                targetSection.scrollIntoView({ behavior: &#39;smooth&#39; });
            }
            showToast(&quot;Serviço Selecionado&quot;, `Preencha seus dados para agendar: ${serviceName}`);
        }

        function handleBookingSubmit(event) {
            event.preventDefault();

            const name = document.getElementById(&#39;client-name&#39;).value.trim();
            const phone = document.getElementById(&#39;client-phone&#39;).value.trim();
            const oracle = document.getElementById(&#39;oracle-choice&#39;).value;
            const format = document.getElementById(&#39;session-format&#39;).value;
            const date = document.getElementById(&#39;pref-date&#39;).value || &#39;A combinar&#39;;
            const period = document.getElementById(&#39;pref-period&#39;).value;
            const notes = document.getElementById(&#39;client-notes&#39;).value.trim() || &#39;Nenhuma observação adicional.&#39;;

            const message = `✨ *AGENDAMENTO DE CONSULTA - CIGANA MARIANA* ✨\n\n` +
                            `👤 *Nome:* ${name}\n` +
                            `📞 *Telefone:* ${phone}\n` +
                            `🔮 *Oráculo:* ${oracle}\n` +
                            `📱 *Formato:* ${format}\n` +
                            `📅 *Data de Preferência:* ${date}\n` +
                            `⏰ *Período:* ${period}\n` +
                            `💬 *Foco da Consulta:* ${notes}\n\n` +
                            `Olá Cigana Mariana, gostaria de confirmar o meu horário!`;

            const encodedMsg = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/5531988956933?text=${encodedMsg}`;

            showToast(&quot;Redirecionando...&quot;, &quot;Abrindo WhatsApp oficial (31) 98895-6933 com sua mensagem.&quot;);
            setTimeout(() =&gt; {
                window.open(whatsappUrl, &#39;_blank&#39;);
            }, 800);
        }

        /* -------------------------------------------------------------
           7. FAQ ACCORDION
        ------------------------------------------------------------- */
        function toggleFaq(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector(&#39;fa-chevron-down&#39;) || btn.querySelector(&#39;i&#39;);

            if (content.style.maxHeight &amp;&amp; content.style.maxHeight !== &#39;0px&#39;) {
                content.style.maxHeight = &#39;0px&#39;;
                if (icon) icon.style.transform = &#39;rotate(0deg)&#39;;
            } else {
                content.style.maxHeight = content.scrollHeight + &#39;px&#39;;
                if (icon) icon.style.transform = &#39;rotate(180deg)&#39;;
            }
        }

        /* -------------------------------------------------------------
           8. MOBILE MENU TOGGLE
        ------------------------------------------------------------- */
        const mobileToggle = document.getElementById(&#39;mobile-toggle&#39;);
        const mobileNav = document.getElementById(&#39;mobile-nav&#39;);
        if (mobileToggle &amp;&amp; mobileNav) {
            mobileToggle.addEventListener(&#39;click&#39;, () =&gt; {
                mobileNav.classList.toggle(&#39;hidden&#39;);
            });
            document.querySelectorAll(&#39;.mobile-link&#39;).forEach(link =&gt; {
                link.addEventListener(&#39;click&#39;, () =&gt; {
                    mobileNav.classList.add(&#39;hidden&#39;);
                });
            });
        }

        /* -------------------------------------------------------------
           9. TOAST NOTIFICATION SYSTEM
        ------------------------------------------------------------- */
        function showToast(title, msg) {
            const toast = document.getElementById(&#39;toast-notification&#39;);
            document.getElementById(&#39;toast-title&#39;).textContent = title;
            document.getElementById(&#39;toast-msg&#39;).textContent = msg;

            toast.classList.remove(&#39;translate-y-24&#39;, &#39;opacity-0&#39;, &#39;pointer-events-none&#39;);
            toast.classList.add(&#39;translate-y-0&#39;, &#39;opacity-100&#39;);

            setTimeout(() =&gt; {
                toast.classList.remove(&#39;translate-y-0&#39;, &#39;opacity-100&#39;);
                toast.classList.add(&#39;translate-y-24&#39;, &#39;opacity-0&#39;, &#39;pointer-events-none&#39;);
            }, 3500);
        }
